<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live OTP Receiver - Dynamic All APIs</title>

  <!-- PyScript Core CSS & JavaScript -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: var(--accent-color);
      text-align: center;
      margin-bottom: 20px;
    }

    .container {
      width: 100%;
      max-width: 550px;
    }

    .selector-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
      color: var(--accent-color);
    }

    select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background-color: #0f172a;
      color: #fff;
      border: 1px solid var(--border-color);
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      background-color: #0284c7;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }

    #status-text {
      font-size: 0.85rem;
      color: #38bdf8;
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }

    #otp-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .field {
      margin: 6px 0;
      font-size: 0.95rem;
    }

    .field code {
      background-color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent-color);
      font-family: monospace;
      font-size: 1.1rem;
    }

    .message-box {
      background-color: #0f172a;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
      border-left: 3px solid var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📱 Dynamic Live OTP Receiver</h1>

    <div class="selector-box">
      <label for="countrySelect">1. Select Country (مملکت منتخب کریں):</label>
      <select id="countrySelect">
        <option value="">-- Fetching API Data... --</option>
      </select>

      <label for="numberSelect">2. Select Number (نمبر منتخب کریں):</label>
      <select id="numberSelect">
        <option value="">-- Select Country First --</option>
      </select>

      <button id="fetch-btn">Fetch Live OTP (او ٹی پی حاصل کریں)</button>
      <div id="status-text">🔄 Loading API Data...</div>
    </div>

    <div id="otp-container"></div>
  </div>

  <!-- PyScript Section -->
  <script type="py">
    import re
    import json
    import asyncio
    from datetime import datetime
    from js import document, fetch
    from pyodide.ffi import create_proxy

    # --- ALL 4 APIs CONFIGURATION ---
    PROX = "https://api.allorigins.win/raw?url="
    
    API_LIST = [
        PROX + "http://147.135.212.197/crapi/st/viewstats?token=SE5XREZBUzRfTpVnX2dQh3NQcYB2dZBWQ4JpXVxmblp2alCDi25oZg==",
        PROX + "http://147.135.212.197/crapi/st/viewstats?token=RVdWRElBUzRGcW9WeneNcmd2cGV9ZJd8e29PVlyPcFxeamxSgWVXfw==",
        PROX + "http://147.135.212.197/crapi/had/viewstats?token=SVVSRzRSQmhXkYuBilFrR2iVZoldZ1dfX4N4WGeHhHdmdFhphYZw==",
        "https://pscall.net/restapi/smsreport?key=SFNYSj1SS16DgYdyf4KIgA==&start=0&length=50"
    ]

    # Dynamic Country Code Database
    country_db = {
        "1":"🇺🇸 USA/Canada","93":"🇦🇫 Afghanistan","355":"🇦🇱 Albania","213":"🇩🇿 Algeria",
        "54":"🇦🇷 Argentina","61":"🇦🇺 Australia","43":"🇦🇹 Austria","994":"🇦🇿 Azerbaijan",
        "880":"🇧🇩 Bangladesh","32":"🇧🇪 Belgium","55":"🇧🇷 Brazil","86":"🇨🇳 China",
        "20":"🇪🇬 Egypt","33":"🇫🇷 France","49":"🇩🇪 Germany","91":"🇮🇳 India",
        "62":"🇮🇩 Indonesia","98":"🇮🇷 Iran","964":"🇮🇶 Iraq","39":"🇮🇹 Italy",
        "81":"🇯🇵 Japan","962":"🇯🇴 Jordan","254":"🇰🇪 Kenya","965":"🇰🇼 Kuwait",
        "60":"🇲🇾 Malaysia","52":"🇲🇽 Mexico","31":"🇳🇱 Netherlands","92":"🇵🇰 Pakistan",
        "970":"🇵🇸 Palestine","63":"🇵🇭 Philippines","48":"🇵🇱 Poland","351":"🇵🇹 Portugal",
        "974":"🇶🇦 Qatar","7":"🇷🇺 Russia","966":"🇸🇦 Saudi Arabia","65":"🇸🇬 Singapore",
        "27":"🇿🇦 South Africa","82":"🇰🇷 South Korea","34":"🇪🇸 Spain","94":"🇱🇰 Sri Lanka",
        "46":"🇸🇪 Sweden","41":"🇨🇭 Switzerland","886":"🇹🇼 Taiwan","66":"🇹🇭 Thailand",
        "90":"🇹🇷 Turkey","971":"🇦🇪 UAE","44":"🇬🇧 UK","84":"🇻🇳 Vietnam","967":"🇾🇪 Yemen"
    }

    api_messages = []

    def get_country(number):
        clean = str(number).replace("+", "").replace(" ", "").replace("-", "")
        for l in range(4, 0, -1):
            prefix = clean[:l]
            if prefix in country_db:
                return country_db[prefix]
        return "🌍 Other Countries"

    def extract_code(msg):
        match = re.search(r'\b\d{3}[-\s]\d{3}\b|\b\d{4,8}\b', str(msg))
        return match.group(0) if match else "N/A"

    async def fetch_single_api(url):
        try:
            response = await fetch(url)
            text = await response.text()
            data = json.loads(text)

            if isinstance(data, list):
                for row in data:
                    if len(row) >= 3:
                        api_messages.append({
                            "service": row[0] or "Unknown",
                            "num": str(row[1] or ""),
                            "msg": row[2] or "",
                            "date": row[3] if len(row) > 3 else ""
                        })
            elif isinstance(data, dict) and data.get("result") == "success":
                for item in data.get("data", []):
                    api_messages.append({
                        "service": item.get("cli", "Unknown"),
                        "num": str(item.get("num", "")),
                        "msg": item.get("sms", ""),
                        "date": item.get("dateadded", "")
                    })
        except Exception as e:
            pass

    async def fetch_all_data():
        global api_messages
        api_messages = []
        status = document.getElementById("status-text")
        status.textContent = "🔄 Loading Data from 4 APIs..."

        for url in API_LIST:
            await fetch_single_api(url)

        populate_countries()

    def populate_countries():
        c_select = document.getElementById("countrySelect")
        status = document.getElementById("status-text")
        c_select.innerHTML = '<option value="">-- Choose Country --</option>'

        if not api_messages:
            status.textContent = "❌ No numbers returned from APIs!"
            return

        countries = sorted(list(set([get_country(item["num"]) for item in api_messages if len(item["num"]) > 5])))
        
        for c in countries:
            opt = document.createElement("option")
            opt.value = c
            opt.textContent = c
            c_select.appendChild(opt)

        status.textContent = f"✅ Success! Total {len(api_messages)} Messages Loaded."

    def on_country_change(event):
        selected_country = document.getElementById("countrySelect").value
        n_select = document.getElementById("numberSelect")
        n_select.innerHTML = '<option value="">-- Choose Number --</option>'

        if not selected_country:
            return

        filtered_numbers = sorted(list(set([
            item["num"] for item in api_messages 
            if get_country(item["num"]) == selected_country and len(item["num"]) > 5
        ])))

        for num in filtered_numbers:
            opt = document.createElement("option")
            opt.value = num
            opt.textContent = f"+{num}"
            n_select.appendChild(opt)

    def fetch_otp(event):
        selected_num = document.getElementById("numberSelect").value
        container = document.getElementById("otp-container")
        container.innerHTML = ""

        if not selected_num:
            container.innerHTML = '<div class="card">براہ کرم نمبر منتخب کریں۔</div>'
            return

        matched_messages = [item for item in api_messages if str(item["num"]) == str(selected_num)]

        if matched_messages:
            for item in matched_messages:
                code = extract_code(item["msg"])
                country = get_country(item["num"])
                date_str = item["date"] or datetime.now().strftime("%Y-%m-%d %H:%M:%S")

                card_html = f'''
                    <div class="card">
                        <div class="field"><b>🌍 Country:</b> {country}</div>
                        <div class="field"><b>📱 Number:</b> <code>+{item["num"]}</code></div>
                        <div class="field"><b>🛠 Service:</b> <code>{item["service"]}</code></div>
                        <div class="field"><b>🔑 OTP Code:</b> <code>{code}</code></div>
                        <div class="field"><b>⌚ Time:</b> {date_str}</div>
                        <div class="message-box">{item["msg"]}</div>
                    </div>
                '''
                container.innerHTML += card_html
        else:
            container.innerHTML = '<div class="card">کوئی پیغام موصول نہیں ہوا۔</div>'

    # Set Event Listeners
    document.getElementById("countrySelect").addEventListener("change", create_proxy(on_country_change))
    document.getElementById("fetch-btn").addEventListener("click", create_proxy(fetch_otp))

    # Fetch data once on load
    asyncio.ensure_future(fetch_all_data())
  </script>

</body>
</html>
