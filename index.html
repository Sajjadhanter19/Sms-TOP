<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Live Receiver</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    .controls {
      margin-bottom: 20px;
    }

    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }

    #messages-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-weight: bold;
      text-align: center;
    }

    .field {
      margin: 6px 0;
      font-size: 0.95rem;
    }

    .field code {
      background-color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent-color);
      font-family: monospace;
    }

    .message-box {
      background-color: #0f172a;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
      border-left: 3px solid var(--accent-color);
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .btn-link {
      display: block;
      text-align: center;
      background-color: #334155;
      color: #f8fafc;
      text-decoration: none;
      padding: 8px;
      border-radius: 5px;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn-link:hover {
      background-color: #475569;
    }
  </style>
</head>

      "1340":"🇻🇮 US Virgin Islands","967":"🇾🇪 Yemen","260":"🇿🇲 Zambia",
      "263":"🇿🇼 Zimbabwe"
    };

    const seenIds = new Set();

    function getCountry(number) {
      const cleanNum = String(number).replace("+", "").replace(/\s+/g, "");
      for (let len = 4; len >= 1; len--) {
        const prefix = cleanNum.substring(0, len);
        if (countryDb[prefix]) {
          return countryDb[prefix];
        }
      }
      return "🌍 Unknown";
    }

    function extractCode(msg) {
      const match = String(msg).match(/\b\d{3}[-\s]\d{3}\b|\b\d{4,8}\b/);
      return match ? match[0] : "N/A";
    }

    function maskNumber(number) {
      const clean = String(number).replace("+", "");
      if (clean.length > 7) {
        return clean.substring(0, 6) + "****" + clean.substring(clean.length - 3);
      }
      return clean;
    }

    function renderSms(service, number, message, date) {
      const uid = `${date}|${number}|${message.substring(0, 30)}`;
      if (seenIds.has(uid)) return;
      seenIds.add(uid);

      const country = getCountry(number);
      const code = extractCode(message);
      const masked = maskNumber(number);

      const container = document.getElementById("messages-container");
      
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="card-header">💐 『 ɴᴇᴡ ᴏᴛᴘ ʀᴇᴄᴇɪᴠᴇᴅ 』 ✨</div>
        <div class="field"><b>⌚ ᴛɪᴍᴇ:</b> <code>${date}</code></div>
        <div class="field"><b>🌍 ᴄᴏᴜɴᴛʀʏ:</b> ${country}</div>
        <div class="field"><b>📱 ɴᴜ姆ʙᴇʀ:</b> <code>${masked}</code></div>
        <div class="field"><b>🛠 ꜱᴇʀᴠɪᴄᴇ:</b> <code>${service}</code></div>
        <div class="field"><b>🔑 ᴄᴏᴅᴇ:</b> <code>${code}</code></div>
        <div class="field" style="margin-top: 10px;"><b>💬 ᴍᴇssᴀɢᴇ:</b></div>
        <div class="message-box">${message}</div>
        <div class="buttons-grid">
          <a class="btn-link" href="#" target="_blank">📱 Channel</a>
          <a class="btn-link" href="#" target="_blank">☎️ Number</a>
          <a class="btn-link" href="#" target="_blank">📥 NO. CHNL</a>
          <a class="btn-link" href="#" target="_blank">🎀 MAIN CHNL</a>
        </div>
      `;

      container.prepend(card);
    }

    // Demo Data Generator
    function simulateNewSms() {
      const services = ["Google", "WhatsApp", "Telegram", "Facebook", "Amazon"];
      const randomService = services[Math.floor(Math.random() * services.length)];
      const randomCode = Math.floor(100000 + Math.random() * 900000);
      const randomNum = "92" + Math.floor(3000000000 + Math.random() * 9000000);
      const now = new Date().toISOString().replace('T', ' ').substring(0, 19);

      renderSms(
        randomService,
        randomNum,
        `Your ${randomService} verification code is: ${randomCode}`,
        now
      );
    }

</html>
