<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic OTP Selector</title>
<link rel="stylesheet" href="python.py"/>
<style>
  
  :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .selector-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: var(--accent-color);
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background-color: #0f172a;
      color: #fff;
      border: 1px solid var(--border-color);
      font-size: 1rem;
      outline: none;
    }

    #otp-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .field {
      margin: 6px 0;
      font-size: 0.95rem;
    }

    .field code {
      background-color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent-color);
      font-family: monospace;
      font-size: 1.1rem;
    }

    .message-box {
      background-color: #0f172a;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
      border-left: 3px solid var(--accent-color);
    }

    .status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>📱 Select Number & Receive OTP</h1>

  <div class="selector-box">
    <label for="numberSelect">Choose Active Number:</label>
    <select id="numberSelect" onchange="onNumberChange()">
      <option value="">-- Fetching Available Numbers... --</option>
    </select>
    <div class="status" id="statusText">Status: Idle</div>
  </div>

  <div id="otp-container"></div>

  <script>
    const SERVER_URL = "http://localhost:3000";
    let pollInterval = null;

    // 1. Load active numbers list on page load
    async function loadNumbers() {
      try {
        const response = await fetch(`${SERVER_URL}/api/numbers`);
        const data = await response.json();

        const select = document.getElementById("numberSelect");
        select.innerHTML = '<option value="">-- Select a Number --</option>';

        if (data.success && data.numbers.length > 0) {
          data.numbers.forEach(num => {
            const opt = document.createElement("option");
            opt.value = num;
            opt.textContent = `+${num}`;
            select.appendChild(opt);
          });
        } else {
          select.innerHTML = '<option value="">No numbers available</option>';
        }
      } catch (err) {
        document.getElementById("statusText").textContent = "Status: Server offline or error!";
      }
    }

    // 2. Extract OTP code using Regex
    function extractCode(msg) {
      const match = String(msg).match(/\b\d{3}[-\s]\d{3}\b|\b\d{4,8}\b/);
      return match ? match[0] : "N/A";
    }

    // 3. Fetch OTP for the selected number
    async function fetchOtpForNumber(number) {
      try {
        document.getElementById("statusText").textContent = `Status: Checking live OTP for +${number}...`;
        const response = await fetch(`${SERVER_URL}/api/get-otp?number=${encodeURIComponent(number)}`);
        const data = await response.json();

        const container = document.getElementById("otp-container");
        container.innerHTML = "";

        if (data.success && data.messages.length > 0) {
          data.messages.forEach(item => {
            const code = extractCode(item.message);
            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
              <div class="field"><b>📱 Number:</b> <code>+${item.number}</code></div>
              <div class="field"><b>🛠 Service:</b> <code>${item.service}</code></div>
              <div class="field"><b>🔑 OTP Code:</b> <code>${code}</code></div>
              <div class="field"><b>⌚ Time:</b> ${item.date}</div>
              <div class="message-box">${item.message}</div>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = '<div class="card">No OTP received yet for this number. Waiting...</div>';
        }
      } catch (err) {
        console.error("Fetch OTP Error:", err);
      }
    }

    // 4. Handle selection change & start polling every 3 seconds
    function onNumberChange() {
      const selectedNum = document.getElementById("numberSelect").value;
      if (pollInterval) clearInterval(pollInterval);

      if (selectedNum) {
        fetchOtpForNumber(selectedNum);
        pollInterval = setInterval(() => fetchOtpForNumber(selectedNum), 3000);
      } else {
        document.getElementById("otp-container").innerHTML = "";
        document.getElementById("statusText").textContent = "Status: Idle";
      }
    }

    // Init
    window.onload = loadNumbers;
  </script>
</body>
</html>
