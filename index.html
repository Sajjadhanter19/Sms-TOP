<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sajjad Baloch - Debug Finder</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 20px; max-width: 700px; margin: 0 auto; }
    h1 { color: #00e5ff; font-size: 1.4rem; }
    input { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #fff; margin: 10px 0; }
    button { padding: 12px 20px; margin: 5px 5px 5px 0; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }
    .go { background: #00e5ff; color: #000; }
    .test { background: #238636; color: #fff; }
    #log { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-top: 15px; white-space: pre-wrap; font-family: monospace; font-size: 13px; min-height: 120px; }
    .ok { color: #3fb950; }
    .err { color: #f85149; }
    .info { color: #58a6ff; }
  </style>
</head>
<body>
  <h1>سجاد بلوچ Finder (Debug Mode)</h1>
  <p>نیچے بٹن دبائیں اور جو لکھا آئے وہ کاپی کر کے مجھے بھیجیں۔</p>

  <input id="q" value="3520212345671" placeholder="CNIC یا فون نمبر">
  <br>
  <button class="test" onclick="run('3520212345671')">1. Test CNIC</button>
  <button class="test" onclick="run('03126238708')">2. Test Phone</button>
  <button class="go" onclick="run(document.getElementById('q').value)">3. Search</button>

  <div id="log">تیار ہے... بٹن دبائیں</div>

<script>
const logEl = document.getElementById("log");

function log(msg, type) {
  const span = document.createElement("div");
  span.className = type || "";
  span.textContent = msg;
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}

function clearLog() {
  logEl.innerHTML = "";
}

async function run(query) {
  clearLog();
  const q = (query || "").trim().replace(/[\s\-]/g, "");
  log("Query: " + q, "info");
  log("Location: " + location.href, "info");
  log("Starting fetch...", "info");

  const salt = Array.from(crypto.getRandomValues(new Uint8Array(16)))
    .map(b => b.toString(16).padStart(2, "0")).join("") + Date.now();

  log("Salt: " + salt.slice(0, 20) + "...", "info");

  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);

    const res = await fetch(
      "https://identra.janialexa610.workers.dev/api/lookup?q=" + encodeURIComponent(q),
      {
        method: "GET",
        headers: {
          "Accept": "application/json",
          "x-api-key": "identra-client-key-2026",
          "x-device-salt": salt
        },
        signal: controller.signal
      }
    );
    clearTimeout(timer);

    log("HTTP Status: " + res.status, res.ok ? "ok" : "err");

    const text = await res.text();
    log("Response length: " + text.length, "info");
    log("--- RAW RESPONSE ---", "info");
    log(text.substring(0, 1500));

    try {
      const data = JSON.parse(text);
      if (data.citizen && data.citizen.success) {
        log("\n✅ SUCCESS: " + data.citizen.name, "ok");
        log("CNIC: " + data.citizen.cnic, "ok");
        log("Numbers: " + (data.citizen.numbers || []).join(", "), "ok");
      } else if (data.error) {
        log("\n❌ API Error: " + data.error, "err");
      } else {
        log("\n⚠ Unexpected response structure", "err");
      }
    } catch (e) {
      log("JSON parse failed: " + e.message, "err");
    }

  } catch (e) {
    log("\n❌ FETCH FAILED", "err");
    log("Error name: " + e.name, "err");
    log("Error message: " + e.message, "err");

    if (e.name === "AbortError") {
      log("Timeout - request took too long", "err");
    }
    if (location.protocol === "file:") {
      log("\n⚠ آپ file:// سے کھول رہے ہیں۔ یہ اکثر fetch بلاک کرتا ہے۔", "err");
      log("حل: python -m http.server 8080 چلائیں پھر http://localhost:8080 کھولیں", "err");
    }
  }
}
</script>
</body>
</html>
