<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live OTP Receiver - Dynamic Server Request</title>

  <!-- PyScript Core CSS & JavaScript -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: var(--accent-color);
      text-align: center;
      margin-bottom: 20px;
    }

    .container {
      width: 100%;
      max-width: 550px;
    }

    .selector-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
      color: var(--accent-color);
    }

    select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background-color: #0f172a;
      color: #fff;
      border: 1px solid var(--border-color);
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      background-color: #0284c7;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }

    #status-text {
      font-size: 0.85rem;
      color: #38bdf8;
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }

    #otp-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .field {
      margin: 6px 0;
      font-size: 0.95rem;
    }

    .field code {
      background-color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent-color);
      font-family: monospace;
      font-size: 1.1rem;
    }

    .message-box {
      background-color: #0f172a;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
      border-left: 3px solid var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📱 Dynamic Live OTP Receiver</h1>

    <div class="selector-box">
      <label for="countrySelect">1. Select Country (مملکت منتخب کریں):</label>
      <select id="countrySelect">
        <option value="">-- Choose Country --</option>
        <option value="92">🇵🇰 Pakistan (+92)</option>
        <option value="1">🇺🇸 USA (+1)</option>
        <option value="91">🇮🇳 India (+91)</option>
        <option value="44">🇬🇧 UK (+44)</option>
        <option value="971">🇦🇪 UAE (+971)</option>
        <option value="966">🇸🇦 Saudi Arabia (+966)</option>
      </select>

      <label for="numberSelect">2. Select Number (نمبر منتخب کریں):</label>
      <select id="numberSelect">
        <option value="">-- Select Country First --</option>
      </select>

      <button id="fetch-btn">Fetch Live OTP (او ٹی پی حاصل کریں)</button>
      <div id="status-text">Ready</div>
    </div>

    <div id="otp-container"></div>
  </div>

  <!-- PyScript Section -->
  <script type="py">
    import re
    import json
    import asyncio
    from datetime import datetime
    from js import document, fetch
    from pyodide.ffi import create_proxy

    BASE_URL = "http://147.135.212.197/crapi/st/viewstats"
    TOKEN = "SE5XREZBUzRfTpVnX2dQh3NQcYB2dZBWQ4JpXVxmblp2alCDi25oZg=="
    PROX = "https://api.allorigins.win/raw?url="

    def extract_code(msg):
        match = re.search(r'\b\d{3}[-\s]\d{3}\b|\b\d{4,8}\b', str(msg))
        return match.group(0) if match else "N/A"

    async def on_country_change(event):
        country_code = document.getElementById("countrySelect").value
        n_select = document.getElementById("numberSelect")
        status = document.getElementById("status-text")

        n_select.innerHTML = '<option value="">-- Loading Numbers from Server... --</option>'
        if not country_code:
            n_select.innerHTML = '<option value="">-- Select Country First --</option>'
            return

        status.textContent = f"🔄 Requesting server for Country (+{country_code}) numbers..."

        # 1. Sending Direct Request to Server with Country Parameter
        target_url = f"{PROX}{BASE_URL}?token={TOKEN}&country={country_code}"
        
        try:
            response = await fetch(target_url)
            text = await response.text()
            data = json.loads(text)

            n_select.innerHTML = '<option value="">-- Choose Number --</option>'
            numbers_found = set()

            if isinstance(data, list):
                for row in data:
                    if len(row) >= 2 and str(row[1]).startswith(country_code):
                        numbers_found.add(str(row[1]))

            for num in sorted(list(numbers_found)):
                opt = document.createElement("option")
                opt.value = num
                opt.textContent = f"+{num}"
                n_select.appendChild(opt)

            if numbers_found:
                status.textContent = f"✅ Loaded {len(numbers_found)} active numbers for +{country_code}"
            else:
                status.textContent = f"⚠️ No numbers returned from server for +{country_code}"

        except Exception as e:
            status.textContent = "❌ Error fetching numbers from server!"

    async def fetch_otp(event):
        selected_num = document.getElementById("numberSelect").value
        container = document.getElementById("otp-container")
        status = document.getElementById("status-text")
        container.innerHTML = ""

        if not selected_num:
            container.innerHTML = '<div class="card">براہ کرم نمبر منتخب کریں۔</div>'
            return

        status.textContent = f"🔄 Fetching OTP for +{selected_num}..."

        # 2. Sending Request to Server for Selected Number
        target_url = f"{PROX}{BASE_URL}?token={TOKEN}&number={selected_num}"

        try:
            response = await fetch(target_url)
            text = await response.text()
            data = json.loads(text)

            matched_messages = []
            if isinstance(data, list):
                for row in data:
                    if len(row) >= 3 and str(row[1]) == selected_num:
                        matched_messages.append({
                            "service": row[0] or "Unknown",
                            "num": str(row[1]),
                            "msg": row[2] or "",
                            "date": row[3] if len(row) > 3 else ""
                        })

            if matched_messages:
                status.textContent = f"✅ OTP Received ({len(matched_messages)} Messages)"
                for item in matched_messages:
                    code = extract_code(item["msg"])
                    date_str = item["date"] or datetime.now().strftime("%Y-%m-%d %H:%M:%S")

                    card_html = f'''
                        <div class="card">
                            <div class="field"><b>📱 Number:</b> <code>+{item["num"]}</code></div>
                            <div class="field"><b>🛠 Service:</b> <code>{item["service"]}</code></div>
                            <div class="field"><b>🔑 OTP Code:</b> <code>{code}</code></div>
                            <div class="field"><b>⌚ Time:</b> {date_str}</div>
                            <div class="message-box">{item["msg"]}</div>
                        </div>
                    '''
                    container.innerHTML += card_html
            else:
                status.textContent = "⚠️ No OTP messages found for this number."
                container.innerHTML = '<div class="card">کوئی پیغام موصول نہیں ہوا۔</div>'

        except Exception as e:
            status.textContent = "❌ Error fetching OTP from server!"

    # Event Listeners
    document.getElementById("countrySelect").addEventListener("change", create_proxy(on_country_change))
    document.getElementById("fetch-btn").addEventListener("click", create_proxy(fetch_otp))
  </script>

</body>
</html>
